# Render Blueprint: one free web service (API + built React app).
# Postgres comes from a free external provider (e.g. Neon); paste its connection string as DATABASE_URL.
services:
  - type: web
    name: bookleaf-support-portal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build # dev deps (tsc, vite) are needed to build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      # Free hosting can't run a local model, so the live demo uses a hosted provider (Gemini's free tier).
      - key: AI_API_KEY
        sync: false # set in the Render dashboard
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: AI_MODEL
        value: gemini-flash-lite-latest
